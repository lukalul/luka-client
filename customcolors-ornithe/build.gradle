plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'ploceus' version "${loom_version}"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

ploceus {
    setGeneration(2)
    disableLibraryUpgrades()
}

repositories {
    maven {
        url = layout.projectDirectory.dir('local-maven')
        metadataSources { artifact() }
    }
    mavenCentral()
    maven { url = 'https://maven.ornithemc.net/releases' }
    maven { url = 'https://maven.ornithemc.net/snapshots' }
}

configurations.configureEach {
    resolutionStrategy.eachDependency { details ->
        if (details.requested.group == 'org.lwjgl.lwjgl' &&
                details.requested.version == '2.9.4+legacyfabric.15') {
            details.useVersion '2.9.3'
            details.because 'Use the Maven Central LWJGL 2 build; customcolors must not require legacy-lwjgl3'
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings ploceus.mcpMappings('stable', project.minecraft_version, '22')
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

tasks.register('plainJavaChecks', JavaExec) {
    dependsOn testClasses
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'dev.customcolors.FormatChecks'
}
test { failOnNoDiscoveredTests = false }
check.dependsOn plainJavaChecks

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 8
}

java {
    withSourcesJar()
}

