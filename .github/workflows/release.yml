# Every version tag builds luka from this repository and makes a draft GitHub release from the result.
# The update list is not signed here: the signing key stays on the maintainer's PC (see release-work/sign-release.ps1).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      VULKAN_VERSION: 1.4.363.0
    steps:
      - uses: actions/checkout@v4

      - name: Install Java 21
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Java 25
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install build tools
        shell: pwsh
        run: choco install -y --no-progress nsis ninja

      - name: Install the Vulkan SDK
        shell: pwsh
        run: |
          $setup = "$env:RUNNER_TEMP\vulkan-sdk.exe"
          Invoke-WebRequest "https://sdk.lunarg.com/sdk/download/$env:VULKAN_VERSION/windows/vulkansdk-windows-X64-$env:VULKAN_VERSION.exe" -OutFile $setup
          Start-Process -Wait -FilePath $setup -ArgumentList '--root', "C:\VulkanSDK\$env:VULKAN_VERSION", '--accept-licenses', '--default-answer', '--confirm-command', 'install'
          "VULKAN_SDK=C:\VulkanSDK\$env:VULKAN_VERSION" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV

      - name: Build luka
        shell: pwsh
        env:
          JAVA_21: ${{ steps.java21.outputs.path }}
          JAVA_25: ${{ steps.java25.outputs.path }}
        run: |
          $env:Path = "C:\Program Files (x86)\NSIS;C:\Program Files (x86)\NSIS\Bin;$env:Path"
          release-work\ci-build.ps1 -Repo $env:GITHUB_REPOSITORY -Tag $env:GITHUB_REF_NAME

      # Code signing goes here once SignPath has accepted the project: sign Luka.exe before the installer is built, then sign the installer.

      - name: Make the draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $notes = "$env:RUNNER_TEMP\notes.md"
          $inside = $false
          $lines = foreach ($line in Get-Content release-work\CHANGELOG.md) {
            if ($line -like '## *') { if ($inside) { break }; $inside = $true; continue }
            if ($inside) { $line }
          }
          $lines | Set-Content $notes
          $files = @('release\online\Luka-Setup.exe', 'release\online\Luka.exe', 'release\online\client.luka.wtf.zip', 'release\online\update-body.json', 'release\online\DOWNLOADS.md')
          $files += (Get-ChildItem release\online\github -File).FullName
          gh release create $env:GITHUB_REF_NAME --draft --title "luka $($env:GITHUB_REF_NAME.TrimStart('v'))" --notes-file $notes @files
